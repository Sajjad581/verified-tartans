<title>Yarn shade card &mdash; 1,096 colours</title>
<style>
:root{
  --field:#8c8c8c;      /* neutral grey judging field */
  --card:#a8a8a8;
  --ink:#141414; --ink2:#3a3a3a; --line:rgba(0,0,0,.28);
  --flag:#1b1b1b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--field);color:var(--ink);
 font:400 13px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:var(--field);
 border-bottom:1px solid var(--line);padding:14px 18px 10px}
h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.sub{font-size:11.5px;color:var(--ink2);margin-top:3px;letter-spacing:.02em}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
button{font:inherit;font-size:11.5px;letter-spacing:.03em;padding:5px 11px;cursor:pointer;
 background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:0}
button:hover{background:rgba(255,255,255,.22)}
button[aria-pressed="true"]{background:var(--flag);color:#f2f2f2;border-color:var(--flag)}
button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.count{margin-left:auto;font-size:11.5px;color:var(--ink2)}
main{padding:4px 18px 90px}
h2{font-size:11px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;
 margin:26px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);color:var(--ink2)}
h2 span{font-weight:400;letter-spacing:.02em;text-transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:1px;
 background:var(--line);border:1px solid var(--line)}
.sw{background:var(--card);border:0;padding:0;cursor:pointer;text-align:left;display:block}
.chip{height:62px;width:100%;display:block}
.meta{padding:5px 6px 6px;background:var(--card);font-size:10.5px;line-height:1.3}
.hx{font-weight:600;letter-spacing:.02em}
.use{color:var(--ink2)}
.de{display:inline-block;margin-top:2px;padding:0 4px;border:1px solid var(--line);font-size:9.5px}
.de.near{background:var(--flag);color:#f2f2f2;border-color:var(--flag)}
.sw[aria-pressed="true"] .meta{background:var(--flag);color:#f2f2f2}
.sw[aria-pressed="true"] .use{color:#c9c9c9}
/* pair inspector: two colours meeting with NO gap - a visible seam means they are distinguishable */
#pair{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--field);
 border-top:1px solid var(--line);transform:translateY(101%);transition:transform .18s ease}
#pair.on{transform:none}
.pairwrap{display:flex;align-items:stretch;gap:0;padding:12px 18px 14px;max-width:1200px;margin:0 auto}
.half{flex:1;min-width:0}
.hchip{height:104px}
.hmeta{padding:6px 2px;font-size:11px}
.pairinfo{width:210px;flex:0 0 210px;padding:0 0 0 18px;font-size:11.5px;color:var(--ink2)}
.pairinfo b{color:var(--ink);font-size:12px}
.big{font-size:26px;font-weight:650;letter-spacing:-.01em;color:var(--ink);margin:2px 0 6px}
.verdict{margin:6px 0 10px;padding:5px 8px;border:1px solid var(--line);font-size:11px;line-height:1.4}
#list{padding:10px 18px 18px;border-top:1px solid var(--line);max-width:1200px;margin:0 auto}
textarea{width:100%;height:74px;font:12px/1.5 ui-monospace,Menlo,monospace;background:rgba(255,255,255,.5);
 border:1px solid var(--line);padding:6px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){#pair{transition:none}}
@media (max-width:620px){.pairwrap{flex-wrap:wrap}.pairinfo{width:100%;flex:auto;padding:10px 0 0}}
</style></head><body>
<header>
  <h1>Yarn shade card &mdash; 1,096 colours</h1>

    <button data-max="2.5">&le;2.5</button>

    <span class="count" id="count"></span>
  </div>
</header>
<main id="main"></main>
<section id="pair" aria-live="polite">

      <button id="close">Close</button>
    </div>
  </div>
  <div id="list"><div class="sub">Merge list &mdash; copy this back to me</div>
  <textarea id="out" readonly placeholder="Pairs you mark appear here."></textarea></div>
</section>

const main=document.getElementById('main');
const byHex=Object.fromEntries(DATA.map(d=>[d.h,d]));
let sel=[], marks=[];

function render(max){
  main.innerHTML='';let shown=0;
  for(const f of FAMS){
    const rows=DATA.filter(d=>d.f===f && d.d<=max); if(!rows.length) continue;
    shown+=rows.length;
    const h=document.createElement('h2');
    h.innerHTML=f+' <span>&middot; '+rows.length+'</span>';
    const g=document.createElement('div'); g.className='grid';
    for(const d of rows){
      const b=document.createElement('button');
      b.className='sw'; b.setAttribute('aria-pressed','false'); b.dataset.hex=d.h;
      b.innerHTML='<span class="chip" style="background:'+d.h+'"></span>'+
        '<span class="meta"><span class="mono hx">'+d.h+'</span><br>'+
        '<span class="use">'+d.t+' tartan'+(d.t===1?'':'s')+'</span><br>'+
        '<span class="de mono'+(d.d<=2?' near':'')+'">&Delta;'+d.d.toFixed(1)+'</span></span>';
      b.onclick=()=>pick(d.h,b);
      g.appendChild(b);
    }
    main.appendChild(h); main.appendChild(g);
  }
  document.getElementById('count').textContent=shown+' of '+DATA.length+' shown';
}
function pick(hex,btn){
  const i=sel.indexOf(hex);
  if(i>-1){sel.splice(i,1);btn.setAttribute('aria-pressed','false');}
  else{ sel.push(hex); btn.setAttribute('aria-pressed','true');
    if(sel.length>2){const drop=sel.shift();
      const el=document.querySelector('.sw[data-hex="'+drop+'"]'); if(el)el.setAttribute('aria-pressed','false');}}
  if(sel.length===1){const d=byHex[sel[0]]; show(d.h,d.n);}   // default: compare to its nearest
  else if(sel.length===2) show(sel[0],sel[1]);
  else document.getElementById('pair').classList.remove('on');
}
function lab(hex){ // sRGB -> Lab (D65)
  let [r,g,b]=[1,3,5].map(i=>parseInt(hex.substr(i,2),16)/255);
  [r,g,b]=[r,g,b].map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));
  let X=(r*.4124+g*.3576+b*.1805)/.95047,Y=r*.2126+g*.7152+b*.0722,Z=(r*.0193+g*.1192+b*.9505)/1.08883;
  const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;
  return [116*f(Y)-16,500*(f(X)-f(Y)),200*(f(Y)-f(Z))];
}
function dE76(a,b){const A=lab(a),B=lab(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]);}
function show(a,b){
  const A=byHex[a],B=byHex[b]||{h:b,t:0,f:''};
  document.getElementById('cA').style.background=a;
  document.getElementById('cB').style.background=b;
  document.getElementById('mA').innerHTML=a+' &middot; '+A.t+' tartans';
  document.getElementById('mB').innerHTML=b+' &middot; '+(B.t||0)+' tartans';
  const d=(a===A.h&&b===A.n)?A.d:dE76(a,b);
  document.getElementById('dE').textContent='\u0394'+d.toFixed(2);
  const v=document.getElementById('verdict');
  v.textContent = d<=1 ? 'No visible seam. Safe to merge.'
    : d<=2 ? 'Seam only findable side by side. Merging is low risk.'
    : d<=3 ? 'A seam is visible on inspection. Merge only on thin stripes.'
    : 'Clearly two colours. Keep both.';
  document.getElementById('pair').classList.add('on');
  document.getElementById('mark').onclick=()=>{
    const line=a+' -> '+b+'  (dE '+d.toFixed(2)+')';
    if(!marks.includes(line)){marks.push(line);document.getElementById('out').value=marks.join('\n');}
  };
}
document.getElementById('close').onclick=()=>{
  document.getElementById('pair').classList.remove('on');
  document.querySelectorAll('.sw[aria-pressed="true"]').forEach(e=>e.setAttribute('aria-pressed','false'));
  sel=[];
};
document.getElementById('filters').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  [...e.currentTarget.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  render(parseFloat(b.dataset.max)); sel=[];
};
render(99);
</script></body></html>
